[alembic]
# Path to the migration scripts (relative to this file's directory).
script_location = alembic

# Add the current directory to sys.path so `app`, `user`, and `dictionary`
# packages can be imported by env.py. Run alembic from the `back/` directory.
prepend_sys_path = .

# The real URL is set at runtime in env.py from the DATABASE_URL env var
# (falling back to a local postgres connection). Keep this empty.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
